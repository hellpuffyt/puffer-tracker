<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
  <title id="t">Puffer Tracker architecture</title>
  <desc id="d">The browser loads the dashboard and stock pages, whose TradingView widgets fetch market data straight from TradingView. The header's search calls the searchStocks server action, which queries Finnhub. The /api/inngest route, guarded by INNGEST_SIGNING_KEY or INNGEST_DEV, runs two Inngest functions: a welcome e-mail on app/user.created and a daily news summary at 12:00 UTC that reads users and watchlists from MongoDB, fetches Finnhub news, summarises with Gemini and sends through Gmail. Auth pages are not in the repository.</desc>
  <rect width="1200" height="500" fill="#0C0D0D"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A3AAA6"/></marker>
  </defs>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" fill="#A3AAA6" font-size="13">
    <text x="40" y="44" fill="#EEEAE2" font-size="20" font-weight="600">Puffer Tracker: what runs where</text>
    <text x="40" y="68">Next.js App Router app. Market charts are third-party TradingView embeds; the app's own data path is Finnhub search and the Inngest e-mail jobs.</text>
  </g>
  <!-- columns: browser | next.js server | external services -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#A3AAA6" letter-spacing="1">
    <text x="40" y="104">BROWSER</text>
    <text x="400" y="104">NEXT.JS SERVER</text>
    <text x="860" y="104">EXTERNAL SERVICES</text>
  </g>
  <g fill="#17191A" stroke="#2A2E2D" stroke-width="1.5">
    <rect x="40" y="118" width="300" height="118" rx="8"/>
    <rect x="40" y="256" width="300" height="78" rx="8"/>
    <rect x="40" y="354" width="300" height="56" rx="8" stroke-dasharray="5 4"/>
    <rect x="400" y="118" width="400" height="78" rx="8"/>
    <rect x="400" y="230" width="400" height="190" rx="8" stroke="#3FBF8A"/>
    <rect x="860" y="118" width="300" height="56" rx="8"/>
    <rect x="860" y="190" width="300" height="56" rx="8"/>
    <rect x="860" y="262" width="300" height="56" rx="8"/>
    <rect x="860" y="334" width="300" height="56" rx="8"/>
    <rect x="860" y="406" width="300" height="56" rx="8"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#EEEAE2">
    <text x="56" y="144">/  and  /stocks/[symbol]</text>
    <text x="56" y="282">Header search (Cmd/Ctrl-K)</text>
    <text x="56" y="380" fill="#A3AAA6">sign-in / sign-up pages</text>
    <text x="416" y="144">searchStocks()</text>
    <text x="416" y="256" fill="#3FBF8A">/api/inngest</text>
    <text x="876" y="144">TradingView (s3.tradingview.com)</text>
    <text x="876" y="216">Finnhub API</text>
    <text x="876" y="288">MongoDB</text>
    <text x="876" y="360">Gemini (gemini-2.5-flash-lite)</text>
    <text x="876" y="432">Gmail via nodemailer</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#A3AAA6">
    <text x="56" y="166">TradingViewWidget.tsx</text>
    <text x="56" y="186">useTradingViewWidget: injects embed</text>
    <text x="56" y="206">scripts; widgets fetch their own data</text>
    <text x="56" y="224">WatchlistButton: local UI state only</text>
    <text x="56" y="304">SearchCommand.tsx, NavItems.tsx</text>
    <text x="56" y="322">initial list prerendered in Header</text>
    <text x="56" y="398">not in this repository</text>
    <text x="416" y="166">lib/actions/finnhub.actions.ts</text>
    <text x="416" y="184">/search, /stock/profile2, news (getNews)</text>
    <text x="416" y="278">401 unless INNGEST_SIGNING_KEY or INNGEST_DEV</text>
    <text x="416" y="306">sign-up-email</text>
    <text x="416" y="324">  on event app/user.created</text>
    <text x="416" y="352">daily-news-summary</text>
    <text x="416" y="370">  cron 0 12 * * * or app/send.daily.news</text>
    <text x="416" y="388">  users + watchlists, getNews, summarise,</text>
    <text x="416" y="406">  sendNewsSummaryEmail</text>
    <text x="876" y="162">client-side embeds (third party)</text>
    <text x="876" y="234">FINNHUB_API_KEY (server side)</text>
    <text x="876" y="306">MONGODB_URI, database/mongoose.ts</text>
    <text x="876" y="378">GEMINI_API_KEY via Inngest step.ai</text>
    <text x="876" y="450">NODEMAILER_EMAIL / _PASSWORD</text>
  </g>
  <g stroke="#A3AAA6" stroke-width="1.5" fill="none">
    <path d="M340 132 H364 V112 H836 V140 H852" marker-end="url(#a)"/>
    <path d="M340 290 C370 290 370 160 392 160" marker-end="url(#a)"/>
    <path d="M800 170 C830 170 830 212 852 212" marker-end="url(#a)"/>
    <path d="M800 290 H852" marker-end="url(#a)"/>
    <path d="M800 330 C830 330 830 228 852 228" marker-end="url(#a)"/>
    <path d="M800 370 H852" marker-end="url(#a)"/>
    <path d="M800 410 C830 410 830 432 852 432" marker-end="url(#a)"/>
  </g>
</svg>
